[versions]
jetbrains-annotations = "26.0.2"
# InventoryView changed from a class to an interface type in 1.21. That used to throw
# IncompatibleClassChangeError on the Dynamic Title Update feature when compiled against an
# older (class-based) InventoryView while running on a newer (interface-based) runtime.
# This is now handled by McVersion#isModern() branching in InventoryUpdate.java, ReflectionUtils.java
# and AnvilInputNMS.java, and by compiling inventory-framework-platform-bukkit/-paper against a
# matching modern Spigot/Paper artifact (see the versions below) instead of the old pinned 1.20.6 one.
# inventory-framework-platform-paper also requires a Java 25 toolchain, since Paper's own published
# artifacts for this version declare that requirement (see its build.gradle.kts).
spigot = "26.1-R0.1-SNAPSHOT"
paperSpigot = "26.1.2.build.+"
junit = "6.0.0"
mockito = "4.11.0"
adventure-api = "4.25.0"
kotlin = "2.3.21"
plugin-shadowjar = "8.3.8"
plugin-spotless = "7.2.1"
plugin-bukkit = "0.8.0"
minestom = "b39badc77b"
folialib = "0.5.1"

[libraries.spigot]
module = "org.spigotmc:spigot-api"
version.ref = "spigot"

[libraries.paperSpigot]
module = "io.papermc.paper:paper-api"
version.ref = "paperSpigot"

[libraries.jetbrains-annotations]
module = "org.jetbrains:annotations"
version.ref = "jetbrains-annotations"

[libraries.junit-bom]
module = "org.junit:junit-bom"
version.ref = "junit"

[libraries.junit-jupiter]
module = "org.junit.jupiter:junit-jupiter"

[libraries.junit-launcher]
module = "org.junit.platform:junit-platform-launcher"

[libraries.mockito-core]
module = "org.mockito:mockito-core"
version.ref = "mockito"

[libraries.mockito-junit]
module = "org.mockito:mockito-junit-jupiter"
version.ref = "mockito"

[libraries.adventure-api]
module = "net.kyori:adventure-api"
version.ref = "adventure-api"

[libraries.minestom]
module = "net.minestom:minestom-snapshots"
version.ref = "minestom"

[libraries.folialib]
module = "com.tcoded:FoliaLib"
version.ref = "folialib"

[plugins]
shadowjar = { id = "com.gradleup.shadow", version.ref = "plugin-shadowjar" }
spotless = { id = "com.diffplug.spotless", version.ref = "plugin-spotless" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
bukkit = { id = "de.eldoria.plugin-yml.bukkit", version.ref = "plugin-bukkit" }
runPaper = { id = "xyz.jpenilla.run-paper", version =  "3.0.2" }
publish = { id = "com.vanniktech.maven.publish.base", version = "0.34.0" }